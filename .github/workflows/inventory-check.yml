name: Inventory Check

# クラウド(GitHub Actions)上で定期的に在庫をチェックする。
# - スケジュール実行はデフォルトブランチ(main)の本ファイルが使われる。
# - 在庫状態が変化したとき(在庫あり等)だけ Discord に通知する。
on:
  schedule:
    # 日本時間(JST=UTC+9)の 9:00〜21:00 のみ、5分ごとに実行する。
    # cron は UTC 基準のため JST 9:00〜21:00 = UTC 0:00〜12:00 に変換。
    - cron: "*/5 0-11 * * *"   # UTC 0:00〜11:55  = JST 9:00〜20:55(5分ごと)
    - cron: "0 12 * * *"       # UTC 12:00        = JST 21:00(締めの1回)
  workflow_dispatch:  # 手動実行も可能
    inputs:
      test_notify:
        description: "テスト通知を送る (在庫に関係なくDiscordへ1回送信して連携を確認)"
        type: boolean
        default: false

# 同時実行を防ぎ、state キャッシュの競合を避ける
concurrency:
  group: inventory-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Discord webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secret 'DISCORD_WEBHOOK_URL' が未設定です。リポジトリの Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi

      # 前回の在庫状態(state.json)を実行間で引き継ぐ。
      # key は実行ごとに一意 → 毎回新しいキャッシュを保存。
      # restore-keys のプレフィックス一致で直近の state を復元する。
      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: state.json
          key: inventory-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-state-

      - name: Run inventory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            echo "テスト通知モードで実行します。"
            python main.py --test-notify --config config.ci.json
          else
            python main.py --once --config config.ci.json --state state.json
          fi
