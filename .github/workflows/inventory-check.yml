name: Inventory Check

# クラウド(GitHub Actions)上で定期的に在庫をチェックする。
# - スケジュール実行はデフォルトブランチ(main)の本ファイルが使われる。
# - 在庫状態が変化したとき(在庫あり等)だけ Discord に通知する。
on:
  schedule:
    # 日本時間(JST=UTC+9)の 9:00〜21:00 のみ、3分ごとにチェックする。
    # GitHub Actions の cron は最短5分間隔のため、3分を実現するには
    # 1つのジョブ内でループ実行する。各ジョブは3分ごとにチェックして
    # 約59分で終了し、次の「毎時起動」の cron が再起動する。
    # cron は UTC 基準。UTC 0〜11時 = JST 9〜20時 の毎時2分に起動。
    - cron: "2 0-11 * * *"
  workflow_dispatch:  # 手動実行も可能
    inputs:
      test_notify:
        description: "テスト通知を送る (在庫に関係なくDiscordへ1回送信して連携を確認)"
        type: boolean
        default: false
      config:
        description: "使用する設定ファイル (検知テスト用に config.test.json を指定可能。本番監視には影響しない)"
        type: string
        default: "config.ci.json"

# 同時実行を防ぎ、state キャッシュの競合を避ける
concurrency:
  group: inventory-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # ループ実行(約59分)の安全上限。万一終了しなくてもここで打ち切る。
    timeout-minutes: 62
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Discord webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secret 'DISCORD_WEBHOOK_URL' が未設定です。リポジトリの Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi

      # 前回の在庫状態(state.json)を実行間で引き継ぐ。本番監視(スケジュール実行)にのみ使う。
      # key は実行ごとに一意 → 毎回新しいキャッシュを保存。
      # restore-keys のプレフィックス一致で直近の state を復元する。
      # 手動実行(workflow_dispatch)は config.test.json 等での単発検知テストに使うため、
      # この共有キャッシュには触れず毎回まっさらな state で実行する(本番の状態を汚さない)。
      - name: Restore previous state
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: state.json
          key: inventory-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-state-

      - name: Run inventory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            echo "テスト通知モードで実行します。"
            python main.py --test-notify --config "${{ github.event.inputs.config }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行: 指定した設定ファイルを1回だけチェックします(state は保存しません)。"
            python main.py --once --config "${{ github.event.inputs.config }}" --state state.manual.json
          else
            # config.ci.json の interval_minutes(=3分)ごとにループ。
            # 約59分(3540秒)で自動終了し、次の毎時 cron が再起動する。
            python main.py --config config.ci.json --state state.json --max-runtime 3540
          fi
